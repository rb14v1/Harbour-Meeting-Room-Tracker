# Usage (Docker Desktop must be running):
#   1. Create backend\.env from .env.example and set DB_PASSWORD and DJANGO_SECRET_KEY.
#   2. docker compose up --build -d
#   3. Optional sample data: docker compose exec backend python manage.py seed
#   4. Open http://localhost:8080
name: meeting-room-tracker

services:
  db:
    image: postgres:17
    # DB_PASSWORD comes from backend\.env. The shell maps it to POSTGRES_PASSWORD
    # so the password is not written into this file.
    env_file: ./backend/.env
    environment:
      POSTGRES_DB: meeting_rooms
      POSTGRES_USER: meeting_app
    entrypoint: ["sh", "-c", 'POSTGRES_PASSWORD="$$DB_PASSWORD" exec docker-entrypoint.sh postgres']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_app -d meeting_rooms"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
