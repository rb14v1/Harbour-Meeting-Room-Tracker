name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Django + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: meeting_rooms
          POSTGRES_USER: meeting_app
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meeting_app -d meeting_rooms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_NAME: meeting_rooms
      DB_USER: meeting_app
      DB_PASSWORD: ci-password
      DB_HOST: localhost
      DB_PORT: "5432"
      DJANGO_DEBUG: "0"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker image (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          load: true
          push: false
          tags: ci-${{ matrix.component }}:test
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Start container and check /healthz
        run: |
          docker run -d --name app -p 8080:8080 \
            -e RUN_MIGRATIONS=0 -e DJANGO_SECRET_KEY=ci-only \
            -e DJANGO_ALLOWED_HOSTS=localhost -e CORS_ALLOWED_ORIGINS=http://localhost \
            -e DB_NAME=x -e DB_USER=x -e DB_PASSWORD=x -e DB_HOST=localhost \
            ci-${{ matrix.component }}:test
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-connrefused \
            http://localhost:8080/healthz
      - name: Container logs
        if: failure()
        run: docker logs app
